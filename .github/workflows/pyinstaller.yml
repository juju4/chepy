---
name: pyinstaller

on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  pyinstaller:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        python-version: 
          - "3.12"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install
        # if: steps.devcache.outs.cache-hit != 'true'
        run: |
          git submodule update --init --recursive
          pip install -r requirements.txt
          python -m pip install --upgrade pip
          pip install .[extras]
        
      # or https://github.com/sayyid5416/pyinstaller
      - name: Create pyinstaller Executable - non-Windows
        run: |
          set -x
          pip install pyinstaller
          pyinstaller --clean -y --name chepy cli.py
          ls -lR dist/
        if: matrix.os != 'windows-latest'
      - name: Create pyinstaller Executable - Windows
        run: |
          pip install pyinstaller
          pyinstaller --clean -y --name chepy cli.py
        if: matrix.os == 'windows-latest'

      - name: Generate checksum
        run: |
          sha256sum dist/chepy/* | tee dist/chepy.sha256
        continue-on-error: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.3'
      - name: Check install!
        run: cosign version
      # https://docs.sigstore.dev/cosign/signing/signing_with_blobs/
      # https://www.qcecuring.com/blog/sigstore-cosign-keyless-github-actions
      - name: Sign file with GitHub OIDC Token
        run: |
          cosign sign-blob --yes \
            --bundle dist/artifacts.sigstore.json \
            dist/chepy/chepy
          ls -l dist/
          cat dist/artifacts.sigstore.json
      - name: Verify cosign signature
        run: |
          cosign verify-blob \
            --certificate-identity-regexp "https://github.com/juju4/chepy/.github/workflows/pyinstaller.yml@refs/heads/*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --bundle dist/artifacts.sigstore.json \
            dist/chepy/chepy
      - uses: actions/upload-artifact@v7
        with:
          name: chepy
          path: dist/*

      - name: Create one-time usage test certificate
        run: |
          set -x
          openssl genpkey -algorithm RSA -aes-256-cbc -out privatekey.key -pkeyopt rsa_keygen_bits:2048 -pass pass:test
          openssl req -new -key privatekey.key -out request.csr -passin pass:test -subj "/C=GB/CN=foo"
          openssl x509 -req -in request.csr -signkey privatekey.key -out certificate.crt -days 1 -sha256 -passin pass:test
          openssl pkcs12 -export -in certificate.crt -inkey privatekey.key -out certificate.pfx \
            -passin pass:test \
            -passout pass:test
          ls -l

      - name: Install pymsix and dependencies
        run: |
          set -x
          sudo apt-get install -y osslsigncode
          pip install pymsix==1.1.5
          pip show pymsix
          find / -name libmsix.so -ls
          dpkg -l |grep libicu
      - name: Pack/Unpack/Sign with pymsix
        run: |
          set -x
          pwd
          ls -l
          cp AppxManifest.xml dist/
          ls -l dist
          python3 gen-msix.py
          ls -l
          file *.msix
      - name: Verify with osslsigncode
        run: |
          osslsigncode verify -in chepy.msix -CAfile certificate.crt -verbose
