---
name: pyinstaller

on: [push]

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  pyinstaller-linux:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: 'ubuntu-latest'
            os_short: linux
            architecture: x86_64
            experimental: false
            binary_name: chepy
            python_version: "3.12"
    env:
      SPECNAME: chepy
      BINARY: ${{ matrix.binary_name }}-${{ matrix.os_short }}-${{ matrix.architecture }}-${{github.ref_name}}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          cache: 'pip'

      - name: Install
        # if: steps.devcache.outs.cache-hit != 'true'
        run: |
          git submodule update --init --recursive
          pip install -r requirements.txt
          python -m pip install --upgrade pip
          pip install .[extras]

      - name: Install Astral uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Run Guarddog
        run: uvx guarddog pypi verify requirements.txt --output-format sarif --exclude-rules repository_integrity_mismatch > guarddog.sarif
      - name: Upload SARIF file to GitHub
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: guarddog-builtin
          sarif_file: guarddog.sarif

      # or https://github.com/sayyid5416/pyinstaller
      - name: Create pyinstaller Executable
        run: |
          set -x
          pip install pyinstaller
          pyinstaller --clean -y --name $SPECNAME cli.py
          mv dist/$SPECNAME/$SPECNAME dist/$SPECNAME/$BINARY
          ls -lR dist/

      - name: Generate checksum
        run: |
          sha256sum dist/chepy/* | tee dist/chepy.sha256
        continue-on-error: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.3'
      - name: Check install!
        run: cosign version
      # https://docs.sigstore.dev/cosign/signing/signing_with_blobs/
      # https://www.qcecuring.com/blog/sigstore-cosign-keyless-github-actions
      - name: Sign file with GitHub OIDC Token
        run: |
          cosign sign-blob --yes --bundle dist/artifacts.sigstore.json dist/chepy/$BINARY
          ls -l dist/
          cat dist/artifacts.sigstore.json
      - name: Verify cosign signature
        run: |
          cosign verify-blob --certificate-identity-regexp "https://github.com/juju4/chepy/.github/workflows/pyinstaller.yml@refs/heads/*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --bundle dist/artifacts.sigstore.json dist/chepy/$BINARY
      - uses: actions/upload-artifact@v7
        with:
          name: chepy
          path: dist/*

      - name: Create one-time usage test certificate
        run: |
          set -x
          openssl genpkey -algorithm RSA -aes-256-cbc -out privatekey.key -pkeyopt rsa_keygen_bits:2048 -pass pass:test
          openssl req -new -key privatekey.key -out request.csr -passin pass:test -subj "/C=GB/CN=foo" -addext "keyUsage=digitalSignature" -addext "extendedKeyUsage=codeSigning"
          openssl x509 -req -in request.csr -signkey privatekey.key -out certificate.crt -days 1 -sha256 -passin pass:test
          openssl pkcs12 -export -in certificate.crt -inkey privatekey.key -out certificate.pfx \
            -passin pass:test \
            -passout pass:test
          ls -l
        continue-on-error: true

      - name: Install osslsigncode - Linux
        run: |
          set -x
          sudo apt-get install -y osslsigncode
      - name: Validate AppxManifest.xml with xmllint
        run: |
          sudo apt-get install -y libxml2-utils
          xmllint --format AppxManifest.xml
      - name: Install pymsix and dependencies
        run: |
          set -x
          pip install pymsix==1.1.5
          pip show pymsix
          libmsixpath=$(find / -name libmsix.so 2>/dev/null | head -1)
          libmsixdir=$(dirname $libmsixpath)
          chmod +x /opt/hostedtoolcache/Python/3.*/x64/lib/python3.*/site-packages/msix/bin/libmsix.so /opt/hostedtoolcache/Python/3.*/x64/lib/python3.*/site-packages/msix/bin/makemsix
          echo $libmsixdir | sudo tee /etc/ld.so.conf.d/makemsix.conf
          sudo ldconfig
          ldd "$libmsixdir/makemsix"
          dpkg -l |grep libicu
      - name: Pack/Unpack/Sign with pymsix
        run: |
          set -x
          pwd
          ls -l
          cp AppxManifest.xml dist/chepy/
          ls -l dist
          python3 gen-msix.py
      - name: Check pymsix output
        run: |
          ls -l . output/
          file *.msix output/*.msix
        if: ${{ always() }}
        continue-on-error: true
      - name: Unpack pymsix output
        run: |
          python3 unpack-msix.py
        if: ${{ always() }}
        continue-on-error: true
      - name: Add self-signed cert to system trust store
        run: |
          sudo install -m 0644 certificate.crt /usr/share/ca-certificates/
          echo certificate.crt | sudo tee -a /etc/ca-certificates.conf
          sudo update-ca-certificates
        if: ${{ always() }}
        continue-on-error: true
      - name: Unpack pymsix output (2)
        run: |
          python3 unpack-msix.py
        if: ${{ always() }}
        continue-on-error: true
      - name: Verify with osslsigncode
        run: |
          osslsigncode verify -in output/chepy.msix -CAfile certificate.crt -verbose

  pyinstaller-win-makeappx:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: 'windows-latest'
            os_short: win
            architecture: x86_64
            experimental: false
            binary_name: chepy.exe
            python_version: "3.12"
    env:
      SPECNAME: chepy
      BINARY: ${{ matrix.binary_name }}-${{ matrix.os_short }}-${{ matrix.architecture }}-${{github.ref_name}}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          cache: 'pip'

      - name: Install
        # if: steps.devcache.outs.cache-hit != 'true'
        run: |
          git submodule update --init --recursive
          pip install -r requirements.txt
          python -m pip install --upgrade pip
          pip install .[extras]

      - name: Create pyinstaller Executable - Windows
        run: |
          pip install pyinstaller
          pyinstaller --clean -y --name $env:SPECNAME cli.py
          move dist/$env:SPECNAME/$env:SPECNAME dist/$env:SPECNAME/$env:BINARY

      - name: Generate checksum
        run: |
          sha256sum dist/chepy/* | tee dist/chepy.sha256
        continue-on-error: true

      - name: Create one-time usage test certificate
        run: |
          set -x
          openssl genpkey -algorithm RSA -aes-256-cbc -out privatekey.key -pkeyopt rsa_keygen_bits:2048 -pass pass:test
          openssl req -new -key privatekey.key -out request.csr -passin pass:test -subj "/C=GB/CN=foo"
          openssl x509 -req -in request.csr -signkey privatekey.key -out certificate.crt -days 1 -sha256 -passin pass:test
          openssl pkcs12 -export -in certificate.crt -inkey privatekey.key -out certificate.pfx \
            -passin pass:test \
            -passout pass:test
          ls -l
        continue-on-error: true

      - name: Setup WinApp CLI
        uses: microsoft/setup-WinAppCli@v0.2

      - name: Generate development certificate
        run: |
          winapp cert generate --if-exists skip
      - name: Import PfxCertificate with winapp
        shell: pwsh
        run: |
          winapp cert info D:\a\chepy\chepy\devcert.pfx
          winapp cert install D:\a\chepy\chepy\devcert.pfx
      - name: Import PfxCertificate
        shell: pwsh
        run: |
          $secureString = ConvertTo-SecureString "password" -AsPlainText -Force
          Import-PfxCertificate -FilePath D:\a\chepy\chepy\devcert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secureString
        continue-on-error: true

      - name: Validate AppManifest
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          Install-Module -Name msix -Force
          Test-MsixManifest -Path .\AppxManifest.xml

      - name: Validate AppManifest (2)
        shell: pwsh
        run: |
          Add-AppxPackage –Register .\AppxManifest.xml

      - name: Package MSIX - winapp
        run: |
          winapp pack .\dist\chepy `
            --manifest .\AppxManifest.xml `
            --cert D:\a\chepy\chepy\devcert.pfx `
            --verbose
          dir d:\a\chepy\chepy
          winapp tool signtool verify d:\a\chepy\chepy\com.chepy.chepy_*.msix --verbose
        continue-on-error: true

      - name: Package MSIX - makeappx
        run: |
          makeappx.exe pack /d .\dist\chepy\ /p chepy.msix
          signtool sign /fd sha256 /v /sm /s TrustedPeople /a /t http://timestamp.digicert.com /f D:\a\chepy\chepy\devcert.pfx .\chepy.msix
          signtool verify chepy.msix
        continue-on-error: true

      - name: Install MSIX
        shell: pwsh
        run: |
          Add-AppxPackage d:\a\chepy\chepy\com.chepy.chepy_*.msix
        continue-on-error: true

      - name: Test application
        shell: pwsh
        run: |
          $package = Get-AppxPackage -Name "com.chepy.chepy"

          if (-not $package) {
            throw "MSIX package was not installed"
          }

          Write-Host "Installed: $($package.FullName)"
        continue-on-error: true

      - name: Get-AppxPackage
        shell: pwsh
        run: |
          Get-AppxPackage -AllUsers
        continue-on-error: true

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@08976cb623803b1b36d7112d4ff9f59eae704de0  # v1.12.0
        id: msdo
        with:
          tools: antimalware,binskim
        continue-on-error: true
      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
        continue-on-error: true

      - name: Upload MSIX
        uses: actions/upload-artifact@v7
        with:
          name: chepy-msix
          path: "*.msix"

  pyinstaller-macos:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: 'macOS-latest'
            os_short: macos
            architecture: arm64
            experimental: false
            binary_name: chepy
            python_version: "3.12"
    env:
      SPECNAME: chepy
      BINARY: ${{ matrix.binary_name }}-${{ matrix.os_macos }}-${{ matrix.architecture }}-${{github.ref_name}}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          cache: 'pip'

      - name: Install
        # if: steps.devcache.outs.cache-hit != 'true'
        run: |
          git submodule update --init --recursive
          pip install -r requirements.txt
          python -m pip install --upgrade pip
          pip install .[extras]

      # or https://github.com/sayyid5416/pyinstaller
      - name: Create pyinstaller Executable - non-Windows
        run: |
          set -x
          pip install pyinstaller
          pyinstaller --clean -y --name $SPECNAME cli.py
          mv dist/$SPECNAME/$SPECNAME dist/$SPECNAME/$BINARY
          ls -lR dist/

      - name: Generate checksum
        run: |
          sha256sum dist/chepy/* | tee dist/chepy.sha256
        continue-on-error: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.3'
      - name: Check install!
        run: cosign version
      # https://docs.sigstore.dev/cosign/signing/signing_with_blobs/
      # https://www.qcecuring.com/blog/sigstore-cosign-keyless-github-actions
      - name: Sign file with GitHub OIDC Token
        run: |
          cosign sign-blob --yes --bundle dist/artifacts.sigstore.json dist/$SPECNAME/$BINARY
          ls -l dist/
          cat dist/artifacts.sigstore.json
        if: matrix.os != 'windows-latest'
      - name: Verify cosign signature
        run: |
          cosign verify-blob --certificate-identity-regexp "https://github.com/juju4/chepy/.github/workflows/pyinstaller.yml@refs/heads/*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --bundle dist/artifacts.sigstore.json dist/chepy/$BINARY
        if: matrix.os != 'windows-latest'
      - uses: actions/upload-artifact@v7
        with:
          name: chepy
          path: dist/*

