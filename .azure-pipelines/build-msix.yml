---
# https://learn.microsoft.com/en-us/windows/msix/desktop/azure-dev-ops

pool:
  vmImage: windows-2019

variables:
  buildPlatform: 'x86'
  buildConfiguration: 'release'
  major: 1
  minor: 0
  build: 0
  revision: $[counter('rev', 0)]
  pythonVersion: '3.14'
  SPECNAME: 'chepy'
  osShort: 'win'
  architecture: 'x86_64'
  binaryName: 'chepy.exe'
  BINARY: 'chepy-win-x86_64-$(Build.SourceBranchName)'

steps:
  - checkout: self
    submodules: true
    clean: true

  - task: UsePythonVersion@0
    displayName: 'Set up Python $(pythonVersion)'
    inputs:
      versionSpec: '$(pythonVersion)'
      architecture: x64

  - powershell: |
      python --version
      python -m pip --version
      python -m pip install --upgrade pip

      python -m pip install -r requirements.txt
      python -m pip install '.[extras]'
    displayName: 'Install dependencies'

  - powershell: |
      python -m pip install guarddog
      guarddog pypi verify requirements.txt --output-format sarif --exclude-rules repository_integrity_mismatch > guarddog.sarif
      Get-Content guarddog.sarif
    displayName: 'Run Guarddog'
    continueOnError: true

  - powershell: |
      python -m pip install pyinstaller
      pyinstaller --clean --noconfirm --name "$(SPECNAME)" cli.py

      if (-not (Test-Path "dist\$(SPECNAME)\$(SPECNAME).exe")) {
        throw "PyInstaller did not produce dist\$(SPECNAME)\$(SPECNAME).exe"
      }
      Rename-Item "dist\$(SPECNAME)\$(SPECNAME).exe" "$(BINARY)"
      Get-ChildItem -Recurse dist | Format-Table FullName, Length
    displayName: 'Create PyInstaller executable'

  - powershell: |
      $files = Get-ChildItem "dist\$(SPECNAME)" -File

      foreach ($file in $files) {
        $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
        "$hash  $($file.Name)" |
          Add-Content "dist\$(SPECNAME).sha256"
      }
      Get-Content "dist\$(SPECNAME).sha256"
    displayName: 'Generate checksum'
    continueOnError: true

  - powershell: |
       # Update appxmanifest. This must be done before the build.
       [xml]$manifest= get-content ".\AppxManifest.xml"
       $manifest.Package.Identity.Version = "$(major).$(minor).$(build).$(revision)"
       $manifest.save("Msix/Package.appxmanifest")
    displayName: 'Version Package Manifest'

  - task: MSBuild@1
    inputs:
      solution: Msix/Msix.wapproj
      platform: $(buildPlatform)
      configuration: $(buildConfiguration)
      msbuildArguments: '/p:OutputPath=NonPackagedApp
       /p:UapAppxPackageBuildMode=SideLoadOnly
       /p:AppxBundle=Never
       /p:AppxPackageOutput=$(Build.ArtifactStagingDirectory)\MsixDesktopApp.msix
       /p:AppxPackageSigningEnabled=false'
    displayName: 'Package the App'

  - task: DownloadSecureFile@1
    inputs:
      secureFile: 'certificate.pfx'
    displayName: 'Download Secure PFX File'

  - script: '"C:\Program Files (x86)\Windows Kits\10\bin\10.0.17763.0\x86\signtool"
      sign /fd SHA256 /f $(Agent.TempDirectory)/certificate.pfx /p secret $(Build.ArtifactStagingDirectory)/MsixDesktopApp.msix'
    displayName: 'Sign MSIX Package'

  - task: MicrosoftSecurityDevOps@1
    displayName: 'Run Microsoft Security DevOps'
    inputs:
      tools: 'antimalware,binskim'
    continueOnError: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact: drop'
